<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Cooperative Assist</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* =====================================================
           PAGE
        ===================================================== */

        .login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            background:
                linear-gradient(
                    135deg,
                    #eef5ff,
                    #f8faff,
                    #eef7f4
                );

        }


        /* =====================================================
           LOGIN CONTAINER
        ===================================================== */

        .login-container {

            width: 100%;

            max-width: 440px;

        }


        /* =====================================================
           LOGO / BRAND
        ===================================================== */

        .login-brand {

            text-align: center;

            margin-bottom: 25px;

        }

        .login-brand-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background: #e9f1ff;

            font-size: 32px;

        }

        .login-brand h1 {

            margin-bottom: 6px;

            color: #172033;

            font-size: 27px;

        }

        .login-brand p {

            color: #748097;

            font-size: 13px;

        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            padding: 32px;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 20px;

            box-shadow:
                0 25px 60px
                rgba(36, 56, 90, 0.10);

        }


        .login-card h2 {

            margin-bottom: 7px;

            color: #172033;

            font-size: 23px;

        }


        .login-description {

            margin-bottom: 25px;

            color: #7a8599;

            font-size: 13px;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #364155;

            font-size: 13px;

            font-weight: 700;

        }


        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dce2eb;

            border-radius: 10px;

            background: #ffffff;

            color: #202a3c;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.08);

        }


        /* =====================================================
           PASSWORD WRAPPER
        ===================================================== */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 48px;

        }


        .toggle-password {

            position: absolute;

            top: 50%;

            right: 13px;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            font-size: 17px;

            cursor: pointer;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(37, 99, 235, 0.18);

        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .error-message {

            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 9px;

            background: #fff0f0;

            border: 1px solid #ffd6d6;

            color: #b33b3b;

            font-size: 13px;

        }


        /* =====================================================
           BACK LINK
        ===================================================== */

        .back-home {

            display: block;

            margin-top: 22px;

            text-align: center;

            color: #2563eb;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

        }


        .back-home:hover {

            text-decoration: underline;

        }


        /* =====================================================
           DEMO INFO
        ===================================================== */

        .demo-box {

            margin-top: 22px;

            padding: 13px 15px;

            border-radius: 10px;

            background: #f4f7fb;

            color: #667287;

            font-size: 12px;

            line-height: 1.6;

        }


        .demo-box strong {

            color: #3b465a;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {

            margin-top: 22px;

            text-align: center;

            color: #8a94a6;

            font-size: 11px;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 500px) {

            .login-page {

                padding: 20px 15px;

            }

            .login-card {

                padding: 24px 20px;

            }

            .login-brand h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


    <main class="login-page">


        <div class="login-container">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="login-brand">

                <div class="login-brand-icon">
                    🤝
                </div>

                <h1>
                    Cooperative Assist
                </h1>

                <p>
                    Governance & Legal Assistance Chatbot
                </p>

            </div>


            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="login-card">

                <h2>
                    Admin Login
                </h2>

                <p class="login-description">
                    Sign in to manage the chatbot
                    knowledge base and enquiries.
                </p>


                <!-- =================================================
                     ERROR MESSAGE
                ================================================== -->

                {% if error %}

                    <div class="error-message">

                        ⚠️ {{ error }}

                    </div>

                {% endif %}


                <!-- =================================================
                     LOGIN FORM
                ================================================== -->

                <form
                    method="POST"
                    action="{{ url_for('admin_login') }}">


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">

                            Username

                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter admin username"
                            autocomplete="username"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">

                            Password

                        </label>


                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter admin password"
                                autocomplete="current-password"
                                required>


                            <button
                                type="button"
                                class="toggle-password"
                                onclick="togglePassword()"
                                aria-label="Show or hide password">

                                👁️

                            </button>

                        </div>

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-btn">

                        🔐 Login

                    </button>

                </form>


                <!-- =================================================
                     DEMO INFORMATION
                ================================================== -->

                <div class="demo-box">

                    <strong>Prototype Login</strong><br>

                    Username:
                    <strong>admin</strong><br>

                    Password:
                    <strong>admin123</strong>

                </div>


                <!-- =================================================
                     BACK HOME
                ================================================== -->

                <a
                    href="{{ url_for('index') }}"
                    class="back-home">

                    ← Back to Chatbot

                </a>

            </div>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="login-footer">

                © 2026 Cooperative Assist

            </div>


        </div>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        function togglePassword() {

            const passwordInput =
                document.getElementById("password");

            const toggleButton =
                document.querySelector(
                    ".toggle-password"
                );


            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type = "text";

                toggleButton.textContent = "🙈";

            } else {

                passwordInput.type = "password";

                toggleButton.textContent = "👁️";

            }

        }

    </script>

</body>

</html>
